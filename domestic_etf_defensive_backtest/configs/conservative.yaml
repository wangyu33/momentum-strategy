strategy_name: domestic_etf_defensive_conservative_v1
strategy_type: weekly_dual_momentum_defensive

objective:
  description: >-
    在国内ETF轮动框架中，进一步提高防守强度：加入511580政金债ETF、现金替代仓位、周频调仓，
    并在弱市和过热阶段更早压低风险暴露。
  target_user:
    - 回撤容忍度较低的国内ETF账户
    - 强调稳定性胜于进攻弹性的稳健型账户

rebalance:
  frequency: weekly
  signal_time: week_end_close
  execution_time: next_session_open

universe:
  risk_assets:
    - '510300'
    - '159949'
    - '159954'
    - '159941'
    - '513880'
  defensive_assets:
    - '518880'
    - '512890'
    - '159985'
    - '511580'
  stress_bucket:
    - code: '511260'
      weight: 0.5
    - code: '511580'
      weight: 0.3
    - code: 'CASH'
      weight: 0.2

signals:
  lookback_days: 25
  short_window_days: 5
  quality_method: slope_penalty
  slope_penalty: 0.85
  leader_margin: 0.003
  absolute_momentum_threshold: 0.06
  weak_trend_defensive_weight: 0.70
  defensive_full_exposure_cap: 0.90
  top2_close_gap: 0.007
  top2_risk_cap: 0.50

market_guard:
  weak_market:
    volume_ratio_20_60_lt: 0.93
    volume_ratio_5_20_lt: 0.92
    breadth_proxy_lt: -0.02
    effective_momentum_lte: 0.18
    risk_cap: 0.20
    weak_bucket:
      '511580': 0.6
      CASH: 0.4
  stress_market:
    volume_ratio_20_60_lt: 0.91
    breadth_proxy_lt: -0.02
    risk_cap: 0.0
    enter_days: 2
    exit_days: 2

overheat_guard:
  pre_overheat_start_cut: 0.12
  pre_overheat_end_cut: 0.18
  pre_overheat_end_exposure: 0.80
  overheat_drawdown_cut: -0.015
  overheat_momentum_cut: 0.22
  overheat_max_exposure: 0.20
  overheat_high_momentum_cut: 0.27
  overheat_high_max_exposure: 0.08

cash_substitute:
  enabled: true
  proxy_asset: CASH
  assumed_daily_return: 0.0

risk_controls:
  no_leverage: true
  lower_turnover_preference: true
  optional_transaction_cost_model:
    enabled: true
    one_way_fee_rate: 0.0003
    one_way_slippage_rate: 0.0002
